[project]
name = "codex-altair-provider"
version = "0.1.0"
description = "A narrow Codex standalone-web-search adapter for llama.cpp on Altair"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12,<4",
]

[project.scripts]
codex-altair-provider = "codex_altair_provider.app:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_altair_provider"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

